<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Seu Nome | Portfólio</title>
  <meta name="description" content="Descrição curta do portfólio.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Newsreader:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
      /* ==========================================================
         Paleta (Coolors p1) — altere as cores apenas aqui
         ========================================================== */
      :root {
        --oliva:   #857E61;
        --taupe:   #B7A196;
        --rosa:    #DDC3D0;
        --lavanda: #DBDAEA;
        --gelo:    #DBFCFF;
    
        /* Neutros para legibilidade */
        --preto:  #000000;
        --branco: #FFFFFF;
    
        /* Papéis semânticos */
        --bg:            var(--gelo);
        --bg-secundario: var(--lavanda);
        --superficie:    var(--branco);
        --texto:         rgba(0, 0, 0, .88);
        --texto-suave:   rgba(0, 0, 0, .68);
        --destaque:      var(--oliva);
        --destaque-2:    var(--rosa);
        --borda:         var(--taupe);
        --link:          var(--preto);
    
        /* Tipografia e medidas */
        --fonte-titulo: "Bricolage Grotesque", system-ui, sans-serif;
        --fonte-texto:  "Newsreader", Georgia, serif;
        --fonte-codigo: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
        --espaco:       clamp(1.25rem, 4vw, 3rem);
        --largura:      68rem;
      }
  
      /* ---------- Base ---------- */
      *, *::before, *::after { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--texto);
        font-family: var(--fonte-texto);
        font-size: 1.125rem;
        line-height: 1.65;
      }
      h1, h2, h3 {
        font-family: var(--fonte-titulo);
        color: var(--preto);
        line-height: 1.1;
        letter-spacing: -.02em;
        margin: 0 0 1rem;
      }
      h1 { font-size: clamp(2.75rem, 8vw, 5.5rem); font-weight: 800; letter-spacing: -.035em; }
      h2 { font-size: clamp(1.75rem, 4vw, 2.5rem); font-weight: 700; }
      h3 { font-size: 1.25rem; font-weight: 700; }
      p  { margin: 0 0 1rem; max-width: 62ch; }
      a  { color: var(--link); text-decoration: underline; text-decoration-color: var(--destaque); text-decoration-thickness: 2px; text-underline-offset: 3px; }
      a:hover { background: var(--destaque-2); }
      :focus-visible { outline: 3px solid var(--preto); outline-offset: 3px; }
      ul, ol { margin: 0; padding: 0; }
  
      .miolo { max-width: var(--largura); margin: 0 auto; }
      .secao { padding: 4rem var(--espaco); }
      .secao--alt { background: var(--bg-secundario); }
      .texto-suave { color: var(--texto-suave); }
  
      .pular { position: absolute; left: -999px; }
      .pular:focus { left: 1rem; top: 1rem; background: var(--branco); padding: .5rem 1rem; z-index: 10; }
  
      /* ---------- Faixa da paleta e topo ---------- */
      /* .faixa { display: grid; grid-template-columns: repeat(5, 1fr); height: 12px; }
      .faixa span:nth-child(1) { background: var(--oliva); }
      .faixa span:nth-child(2) { background: var(--taupe); }
      .faixa span:nth-child(3) { background: var(--rosa); }
      .faixa span:nth-child(4) { background: var(--lavanda); }
      .faixa span:nth-child(5) { background: var(--gelo); } */
  
      .topo { background: var(--bg-secundario); border-bottom: 2px solid var(--destaque); padding: 1rem var(--espaco); }
      .topo .miolo { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .75rem 2rem; }
      .marca { font-family: var(--fonte-titulo); font-weight: 800; font-size: 1.35rem; text-decoration: none; }
      .menu { display: flex; flex-wrap: wrap; gap: .25rem 1.25rem; list-style: none; font-family: var(--fonte-titulo); font-weight: 500; }
      .menu a { text-decoration: none; padding: .25rem .5rem; border-radius: .25rem; }
      .menu a[aria-current="page"] { background: var(--destaque-2); }
  
      /* ---------- Hero ---------- */
      .hero { padding: clamp(3rem, 8vw, 6rem) var(--espaco); }
      .hero .miolo { display: grid; gap: 3rem; align-items: center; }
      .hero p.lead { font-size: 1.35rem; color: var(--texto-suave); }
      .acoes { display: flex; flex-wrap: wrap; gap: .75rem; margin-top: 1.5rem; }
  
      .botao {
        display: inline-block;
        padding: .75rem 1.5rem;
        border-radius: .5rem;
        background: var(--destaque);
        color: var(--preto);
        font-family: var(--fonte-titulo);
        font-weight: 700;
        text-decoration: none;
        border: 2px solid var(--destaque);
      }
      .botao:hover { background: var(--destaque-2); border-color: var(--destaque); }
      .botao--sec { background: var(--destaque-2); border-color: var(--borda); }
      .botao--sec:hover { background: var(--bg-secundario); }
  
      /* Área reservada para imagem/ilustração: barras da paleta */
      .barras { display: flex; align-items: flex-end; gap: .75rem; height: 20rem; }
      .barras span { flex: 1; border: 2px solid var(--borda); border-radius: .5rem .5rem 0 0; }
      .barras span:nth-child(1) { height: 100%; background: var(--oliva); }
      .barras span:nth-child(2) { height: 76%;  background: var(--taupe); }
      .barras span:nth-child(3) { height: 58%;  background: var(--rosa); }
      .barras span:nth-child(4) { height: 82%;  background: var(--lavanda); }
      .barras span:nth-child(5) { height: 44%;  background: var(--gelo); }
  
      /* ---------- Cards, tags, passos, código ---------- */
      .cartoes { display: grid; gap: 1.25rem; margin-top: 2rem; }
      .cartao { background: var(--superficie); border: 2px solid var(--borda); border-radius: .5rem; padding: 1.5rem; }
      .cartao--destaque { background: var(--destaque-2); }
      .cartao p { margin-bottom: 1rem; }
  
      .tags { display: flex; flex-wrap: wrap; gap: .5rem; list-style: none; margin-top: 1.5rem; }
      .tags li { background: var(--destaque-2); color: var(--preto); border: 2px solid var(--borda); border-radius: 999px; padding: .25rem 1rem; font-family: var(--fonte-titulo); font-weight: 500; font-size: 1rem; }
  
      .passos { list-style: none; counter-reset: passo; display: grid; gap: 1rem; margin-top: 2rem; }
      .passos li { counter-increment: passo; display: grid; grid-template-columns: 3rem 1fr; gap: 1rem; background: var(--superficie); border: 2px solid var(--borda); border-radius: .5rem; padding: 1.25rem 1.5rem; }
      .passos li::before { content: counter(passo); font-family: var(--fonte-titulo); font-weight: 800; font-size: 2rem; line-height: 1; color: var(--preto); }
      .passos h3, .passos p { grid-column: 2; margin-bottom: .25rem; }
  
      .codigo { background: var(--superficie); border: 2px solid var(--borda); border-radius: .5rem; padding: 1.25rem 1.5rem; overflow-x: auto; font-family: var(--fonte-codigo); font-size: .95rem; line-height: 1.6; color: var(--preto); margin: 2rem 0 0; }
  
      .lista-links { list-style: none; display: grid; gap: .5rem; margin-top: 1.5rem; }
  
      /* ---------- Rodapé ---------- */
      .rodape { background: var(--destaque); color: var(--preto); padding: 2rem var(--espaco); font-family: var(--fonte-titulo); }
      .rodape p { margin: 0; max-width: none; }
      .rodape a { color: var(--preto); text-decoration-color: var(--preto); }
  
      /* ---------- Telas maiores ---------- */
      @media (min-width: 48rem) {
        .hero .miolo { grid-template-columns: 1.3fr 1fr; }
        .cartoes { grid-template-columns: repeat(3, 1fr); }
      }
      @media (prefers-reduced-motion: reduce) {
        html { scroll-behavior: auto; }
      }

      /* Animações (Scroll) - Adicionar no final do <style> do index.html */
.animar-surgir {
  opacity: 0;
  transform: translateY(30px);
  transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
}
.animar-surgir.visivel { opacity: 1; transform: translateY(0); }
.atraso-1 { transition-delay: 0.1s; }
.atraso-2 { transition-delay: 0.2s; }
.atraso-3 { transition-delay: 0.3s; }

/* Animação contínua das barras (efeito equalizador/gráfico vivo) */
.barras span {
  flex: 1;
  border: 2px solid var(--borda);
  border-radius: .5rem .5rem 0 0;
  transform-origin: bottom;
  /* 'infinite' faz rodar para sempre, e 'alternate' cria o efeito de vai-e-vem */
  animation: equalizador 1.2s ease-in-out infinite alternate;
}

/* O "range" de valores da animação */
@keyframes equalizador {
  0% { transform: scaleY(0.3); } /* Barra encolhe até 30% da altura original */
  100% { transform: scaleY(1); } /* Barra cresce até 100% da altura original */
}

/* 
  Atribuímos durações e atrasos diferentes para cada barra.
  Isso quebra a sincronia e cria aquele efeito orgânico de gráfico se mexendo.
*/
.barras span:nth-child(1) { height: 100%; animation-delay: 0.0s; animation-duration: 2.1s; background: var(--oliva); }
.barras span:nth-child(2) { height: 76%;  animation-delay: 0.3s; animation-duration: 2.3s; background: var(--taupe); }
.barras span:nth-child(3) { height: 58%;  animation-delay: 0.1s; animation-duration: 2.0s; background: var(--rosa); }
.barras span:nth-child(4) { height: 82%;  animation-delay: 0.4s; animation-duration: 2.4s; background: var(--lavanda); }
.barras span:nth-child(5) { height: 44%;  animation-delay: 0.2s; animation-duration: 2.2s; background: var(--gelo); }

/* Estilo para vídeos incorporados (iframes) */
.video-destaque {
  position: relative;
  padding-bottom: 56.25%; /* Mantém a proporção 16:9 */
  height: 0;
  overflow: hidden;
  max-width: 100%;
  border: 10px solid var(--borda);
  border-radius: .5rem;
  background: var(--superficie);
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08); /* Sombra suave para dar destaque */
  transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
  margin: 2rem 0; /* Espaçamento em cima e embaixo */
}

/* Efeito ao passar o mouse por cima do vídeo */
.video-destaque:hover {
  transform: translateY(-5px);
  border-color: var(--preto);
  box-shadow: 0 15px 30px rgba(0, 0, 0, 0.15);
}

/* Remove a borda padrão do iframe e faz ele preencher o espaço */
.video-destaque iframe {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  border: none;
  border-radius: calc(.5rem - 2px); /* Ajusta o cantinho do vídeo à borda externa */
}

/* CSS da Galeria de Imagens */
.galeria-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 1.5rem;
  margin-top: 2rem;
}
.galeria-item {
  border: 2px solid var(--borda);
  border-radius: .5rem;
  overflow: hidden;
  background: var(--superficie);
  aspect-ratio: 4/3; /* Deixa as miniaturas padronizadas, independente do tamanho original */
  transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
}
.galeria-item:hover {
  transform: translateY(-5px);
  border-color: var(--preto);
  box-shadow: 0 10px 20px rgba(0,0,0,0.1);
}
.galeria-item img {
  width: 100%;
  height: 100%;
  object-fit: cover; /* Corta o excesso da imagem sem achatar */
  display: block;
}
    </style>
</head>
<body>
    <div id="content">
      <script>
        document.addEventListener('DOMContentLoaded', () => {
          goToPage('principal');
        });
      </script>
    </div>
    <script>
      function iniciarAnimacoes() {
    const observerOptions = { root: null, rootMargin: '0px', threshold: 0.15 };
    const scrollObserver = new IntersectionObserver((entries, observer) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visivel');
          observer.unobserve(entry.target); 
        }
      });
    }, observerOptions);

    document.querySelectorAll('.animar-surgir').forEach(el => scrollObserver.observe(el));
  }

  function goToPage(pageName) {
    google.script.run
      .withSuccessHandler(function(html) {
        document.getElementById('content').innerHTML = html;
        // Inicia as animações logo após carregar o conteúdo da nova página
        iniciarAnimacoes(); 
        // Rola para o topo ao trocar de página
        carregarGaleria();
        window.scrollTo(0, 0); 
      })
      .getPageContent(pageName);
    }

    function carregarGaleria() {
  const container = document.getElementById('galeria-projetos');
  // Se a página atual não tiver a galeria, a função para por aqui
  if (!container) return; 

  container.innerHTML = '<p class="texto-suave">Carregando imagens do Drive...</p>';

  google.script.run
    .withSuccessHandler(function(imagens) {
      if (imagens.length === 0) {
        container.innerHTML = '<p class="texto-suave">Nenhuma imagem encontrada.</p>';
        return;
      }
      
      container.innerHTML = ''; // Limpa a mensagem de carregando
      
      imagens.forEach(img => {
        container.innerHTML += `
          <div class="galeria-item">
            <img src="${img.url}" alt="${img.nome}" loading="lazy">
          </div>
        `;
      });
    })
    .getImagensDoDrive();
}
    </script>
</body>
</html>
